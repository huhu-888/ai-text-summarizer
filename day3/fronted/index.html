<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 文本摘要助手</title>
    <style>
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        h1 {
            font-size: 22px;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            margin-top: 12px;
            padding: 10px 24px;
            font-size: 15px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 14px;
            background: #f1f5f9;
            border-radius: 6px;
            min-height: 40px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .error {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <h1>AI 文本摘要助手</h1>

    <textarea id="input" placeholder="粘贴要摘要的文本..."></textarea>
    <br>
    <button id="btn">生成摘要</button>

    <div id="result">等待输入...</div>

    <script>
        const input = document.getElementById("input");
        const btn = document.getElementById("btn");
        const result = document.getElementById("result");

        btn.addEventListener("click", async () => {
            const text = input.value.trim();

            if (!text) {
                result.className = "error";
                result.textContent = "请输入文本";
                return;
            }

            btn.disabled = true;
            btn.textContent = "生成中...";
            result.className = "";
            result.textContent = "正在生成摘要...";

            try {
                const response = await fetch("http://127.0.0.1:8000/summarize", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ text: text }),
                });

                const data = await response.json();

                if (!response.ok) {
                    // 请求失败，显示错误信息
                    result.className = "error";
                    result.textContent = "错误：" + (data.detail || "请求失败");
                } else {
                    // 成功，显示摘要
                    result.className = "";
                    result.textContent = data.summary;
                }
            } catch (err) {
                result.className = "error";
                result.textContent = "网络错误：" + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "生成摘要";
            }
        });
    </script>
</body>
</html>
